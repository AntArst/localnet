[package]
name = "localnet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Serverless LAN sessions: mDNS discovery, QUIC with pinned self-signed certificates, PTP clock sync and a GGRS socket adapter."
repository = "https://github.com/AntArst/localnet"
readme = "README.md"
keywords = ["lan", "p2p", "quic", "mdns", "ggrs"]
categories = ["network-programming", "game-development"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tracing = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
mdns-sd = "0.19"
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# aws-lc-rs rather than ring: it is the provider with rustls's hybrid
# X25519MLKEM768 key exchange, which every connection uses (src/transport.rs).
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pki-types = "1.11"
futures = "0.3"
ggrs = "0.11"
bytes = "1.10"
bincode = { version = "2.0", features = ["serde"] }
base64 = "0.22"
fixed = "=1.29.0"
rand = "0.8"
socket2 = "0.6"
statime = { version = "=0.4.0", features = ["std"] }

# Zero-knowledge lobby admission (src/admission.rs): Groth16 over BN254 with
# Poseidon. Optional, so a game that does not gate its lobby builds none of it.
ark-ff = { version = "0.5", default-features = false, optional = true }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"], optional = true }
ark-groth16 = { version = "0.5", default-features = false, optional = true }
ark-snark = { version = "0.5", default-features = false, optional = true }
ark-relations = { version = "0.5", default-features = false, optional = true }
ark-r1cs-std = { version = "0.5", default-features = false, optional = true }
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["r1cs", "sponge"], optional = true }
ark-serialize = { version = "0.5", default-features = false, optional = true }

[features]
admission = [
    "dep:ark-ff",
    "dep:ark-bn254",
    "dep:ark-groth16",
    "dep:ark-snark",
    "dep:ark-relations",
    "dep:ark-r1cs-std",
    "dep:ark-crypto-primitives",
    "dep:ark-serialize",
]

# Proving and setup are far too slow unoptimised, even in tests. arkworks is
# generic, so most of it is compiled into this crate, not only into the
# dependencies. Only applies when localnet itself is built, not to a game that
# depends on it.
[profile.dev]
opt-level = 3

[[test]]
name = "admission"
required-features = ["admission"]

[[example]]
name = "admission_bench"
required-features = ["admission"]
