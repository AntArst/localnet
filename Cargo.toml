[package]
name = "localnet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Serverless LAN sessions: mDNS discovery, QUIC with pinned self-signed certificates, PTP clock sync and a GGRS socket adapter."
repository = "https://github.com/AntArst/localnet"
readme = "README.md"
keywords = ["lan", "p2p", "quic", "mdns", "ggrs"]
categories = ["network-programming", "game-development"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tracing = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
mdns-sd = "0.19"
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1.11"
futures = "0.3"
ggrs = "0.11"
bytes = "1.10"
bincode = { version = "2.0", features = ["serde"] }
base64 = "0.22"
fixed = "=1.29.0"
rand = "0.8"
socket2 = "0.6"
statime = { version = "=0.4.0", features = ["std"] }
